<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boro Burgers</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet" />

</head>

<body>

  <header class="topbar">
    <h1>BORO BBQ</h1>
    <div class="top-buttons">
      <a href="admin.html">
        <button id="adminBtn">
          <span>👨‍🍳</span>
          ADMIN DASHBOARD
        </button>
      </a>
      <div class="cart-button" id="openCart">
        🛒
        <span id="cartCount">0</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>ORDER FAST.</h2>
      <h2>EAT BIG.</h2>
      <button onclick="scrollToMenu()">START ORDER</button>
    </div>
  </section>

  <section class="categories">
    <button class="category active" data-category="All">ALL</button>
    <button class="category" data-category="Burgers">BURGERS</button>
    <button class="category" data-category="Chicken">CHICKEN</button>
    <button class="category" data-category="Sides">SIDES</button>
    <button class="category" data-category="Drinks">DRINKS</button>
  </section>

  <section class="menu" id="menu"></section>

  <!-- CART -->
  <aside class="cart hidden" id="cart">
    <div class="cart-header">
      <h2>YOUR ORDER</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <h3>TOTAL: £<span id="total">0.00</span></h3>
      <button id="checkoutBtn">PLACE ORDER</button>
    </div>
  </aside>

  <div class="overlay hidden" id="overlay"></div>

  <!-- ALL LOGIC IN ONE MODULE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    /* =========================
       FIREBASE INIT
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* =========================
       MENU DATA
    ========================= */

    const foods = [
      { id: 1, name: "Classic Smash",       price: 7.99,  category: "Burgers", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd" },
      { id: 2, name: "Double BBQ",           price: 10.99, category: "Burgers", image: "https://images.unsplash.com/photo-1550547660-d9450f859349" },
      { id: 3, name: "Loaded Fries",         price: 4.99,  category: "Sides",   image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877" },
      { id: 4, name: "Chicken Strips",       price: 6.49,  category: "Chicken", image: "https://images.unsplash.com/photo-1562967916-eb82221dfb36" },
      { id: 5, name: "Mega Chicken Burger",  price: 8.99,  category: "Chicken", image: "https://images.unsplash.com/photo-1606755962773-d324e0a13086" },
      { id: 6, name: "Coke",                 price: 2.49,  category: "Drinks",  image: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e" }
    ];

    /* =========================
       STATE
    ========================= */

    const cart = [];

    /* =========================
       DOM REFS
    ========================= */

    const menuEl      = document.getElementById("menu");
    const cartItemsEl = document.getElementById("cartItems");
    const totalEl     = document.getElementById("total");
    const cartCountEl = document.getElementById("cartCount");

    /* =========================
       MENU RENDER
    ========================= */

    function renderMenu(items = foods) {
      if (!menuEl) return;
      menuEl.innerHTML = "";
      items.forEach(food => {
        menuEl.innerHTML += `
          <div class="card">
            <img src="${food.image}" alt="${food.name}" />
            <div class="card-content">
              <h3>${food.name}</h3>
              <p>£${food.price.toFixed(2)}</p>
              <button data-id="${food.id}" class="add-btn">ADD TO ORDER</button>
            </div>
          </div>
        `;
      });

      // Attach add-to-cart listeners after render
      menuEl.querySelectorAll(".add-btn").forEach(btn => {
        btn.addEventListener("click", () => addToCart(Number(btn.dataset.id)));
      });
    }

    /* =========================
       CART
    ========================= */

    function addToCart(id) {
      const item = foods.find(f => f.id === id);
      if (!item) return;
      cart.push(item);
      updateCart();
    }

    function updateCart() {
      if (!cartItemsEl) return;
      cartItemsEl.innerHTML = "";
      let total = 0;

      cart.forEach((item, i) => {
        total += item.price;
        cartItemsEl.innerHTML += `
          <div class="cart-item">
            <span>${item.name}</span>
            <span>£${item.price.toFixed(2)}</span>
            <button class="remove-btn" data-index="${i}">✕</button>
          </div>
        `;
      });

      totalEl.innerText = total.toFixed(2);
      cartCountEl.innerText = cart.length;

      // Attach remove listeners after render
      cartItemsEl.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          cart.splice(Number(btn.dataset.index), 1);
          updateCart();
        });
      });
    }

    /* =========================
       CHECKOUT
    ========================= */

    document.getElementById("checkoutBtn").addEventListener("click", async () => {

      if (!cart.length) {
        alert("Your cart is empty!");
        return;
      }

      const btn = document.getElementById("checkoutBtn");
      btn.disabled = true;
      btn.textContent = "PLACING ORDER...";

      try {

        const orderData = {
          orderNumber: Math.floor(100000 + Math.random() * 900000),
          items: cart.map(item => ({
            id:    item.id,
            name:  item.name,
            price: item.price
          })),
          total:     cart.reduce((sum, item) => sum + item.price, 0),
          status:    "Preparing",
          completed: false,
          created:   new Date()
        };

        const ref = await addDoc(collection(db, "orders"), orderData);
        console.log("Order saved with ID:", ref.id);

        alert(`Order #${orderData.orderNumber} placed successfully!`);

        // Clear cart
        cart.length = 0;
        updateCart();

        // Close cart panel
        document.getElementById("cart").classList.add("hidden");
        document.getElementById("overlay").classList.add("hidden");

      } catch (err) {
        console.error("Firebase error:", err);
        alert(`Order failed: ${err.message}\n\nCheck Firestore security rules allow writes.`);
      } finally {
        btn.disabled = false;
        btn.textContent = "PLACE ORDER";
      }

    });

    /* =========================
       UI — CART PANEL
    ========================= */

    function setupUI() {

      const openCartBtn  = document.getElementById("openCart");
      const closeCartBtn = document.getElementById("closeCart");
      const cartPanel    = document.getElementById("cart");
      const overlay      = document.getElementById("overlay");

      openCartBtn?.addEventListener("click", () => {
        cartPanel.classList.remove("hidden");
        overlay.classList.remove("hidden");
      });

      function closeAll() {
        cartPanel.classList.add("hidden");
        overlay.classList.add("hidden");
      }

      closeCartBtn?.addEventListener("click", closeAll);
      overlay?.addEventListener("click", closeAll);

      // Category filter
      document.querySelectorAll(".category").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".category").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const cat = btn.dataset.category;
          renderMenu(cat === "All" ? foods : foods.filter(f => f.category === cat));
        });
      });

    }

    /* =========================
       SCROLL HELPER
    ========================= */

    window.scrollToMenu = function () {
      document.getElementById("menu")?.scrollIntoView({ behavior: "smooth" });
    };

    /* =========================
       BOOT
    ========================= */

    renderMenu();
    setupUI();

  </script>

</body>
</html>
