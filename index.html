<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boro Burgers</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

  <script type="module" src="order.js" defer></script>
</head>
<body>

  <header class="topbar">
    <h1>BORO BURGERS</h1>

    <div class="cart-button" id="openCart">
      🛒
      <span id="cartCount">0</span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>ORDER FAST.</h2>
      <h2>EAT BIG.</h2>
      <button onclick="scrollToMenu()">START ORDER</button>
    </div>
  </section>

  <section class="categories">
    <button class="category active" data-category="All">ALL</button>
    <button class="category" data-category="Burgers">BURGERS</button>
    <button class="category" data-category="Chicken">CHICKEN</button>
    <button class="category" data-category="Sides">SIDES</button>
    <button class="category" data-category="Drinks">DRINKS</button>
  </section>

  <section class="menu" id="menu"></section>

  <aside class="cart hidden" id="cart">
    <div class="cart-header">
      <h2>YOUR ORDER</h2>
      <button id="closeCart">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">
      <h3>TOTAL: £<span id="total">0.00</span></h3>

      <button id="checkoutBtn">
        PLACE ORDER
      </button>
    </div>
  </aside>

  <div class="overlay hidden" id="overlay"></div>

</body>
</html>
