<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boro BBQ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <style>
    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay * {
      pointer-events: auto;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 28px;
      width: 92%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
      color: #fff;
    }

    .modal h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin: 0 0 4px;
    }

    .modal-subtitle {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 18px;
    }

    .modal-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f5c400;
      margin: 18px 0 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
    }

    .modal-item-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      color: #ccc;
      margin: 14px 0 8px;
      letter-spacing: 1px;
    }

    .modal-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #222;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .modal-option:hover { background: #2a2a2a; }
    .modal-option input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #f5c400;
      cursor: pointer;
    }
    .modal-option .extra-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #f5c400;
      color: #111;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .modal-footer button {
      flex: 1;
      padding: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-cancel { background: #333; color: #aaa; }
    .btn-confirm { background: #f5c400; color: #111; }

    /* ── MENU SECTIONS ── */
    .menu-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 4px;
      padding: 24px 20px 8px;
      color: #fff;
    }
    .menu-section-title span {
      display: inline-block;
      border-bottom: 3px solid #f5c400;
      padding-bottom: 4px;
    }

    /* ── DISCOUNT PRESETS ── */
    .discount-presets {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }
    .preset-btn {
      flex: 1;
      padding: 16px;
      border: 2px solid #333;
      background: #222;
      color: #ffb703;
      border-radius: 10px;
      font-size: 1.4rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .preset-btn:hover {
      background: #2a2a2a;
      border-color: #ffb703;
    }
    .preset-btn.selected {
      background: #ffb703;
      color: #111;
      border-color: #ffb703;
    }

    /* ── CUSTOM DISCOUNT INPUT ── */
    .discount-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }
    .discount-input-row input {
      flex: 1;
      padding: 14px;
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 1.3rem;
      font-family: 'Bebas Neue', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    .discount-input-row input:focus {
      border-color: #ffb703;
    }
    .discount-input-row input::placeholder {
      color: #555;
    }
    .discount-input-row span {
      font-size: 1.8rem;
      color: #aaa;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ── DISCOUNT BAR IN CART ── */
    .discount-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #ffb703;
      margin-bottom: 12px;
    }
    .discount-bar-label {
      color: #ffb703;
      font-size: 1.1rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }
    .discount-bar-remove {
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .discount-bar-remove:hover { color: #fff; }

    /* ── APPLY DISCOUNT BUTTON ── */
    #discountBtn {
      width: 100%;
      margin-top: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #ffb703;
      padding: 14px;
      border-radius: 15px;
      font-size: 1.3rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #discountBtn:hover {
      border-color: #ffb703;
      background: #222;
    }

    /* ── SUBTOTAL ROW ── */
    .cart-subtotal {
      font-size: 1.3rem;
      color: #888;
      margin-bottom: 4px;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }

    /* ── ORDER ID FIELD ── */
    .order-id-row {
      margin-bottom: 12px;
    }
    .order-id-row label {
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    #orderIdInput {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.15s;
    }
    #orderIdInput:focus {
      border-color: #f5c400;
    }
    #orderIdInput::placeholder {
      color: #555;
    }
    .order-id-error {
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <h1>BORO BBQ</h1>
    <div class="top-buttons">
      <a href="admin.html">
        <button id="adminBtn"><span>👨‍🍳</span> ADMIN DASHBOARD</button>
      </a>
      <div class="cart-button" id="openCart">
        🛒 <span id="cartCount">0</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>ORDER FAST.</h2>
      <h2>EAT BIG.</h2>
      <button onclick="scrollToMenu()">START ORDER</button>
    </div>
  </section>

  <!-- MENU -->
  <div id="menuRoot"></div>

  <!-- CART -->
  <aside class="cart hidden" id="cart">
    <div class="cart-header">
      <h2>YOUR ORDER</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <div id="discountBar"></div>
      <div id="subtotalRow" class="cart-subtotal hidden"></div>

      <div class="order-id-row">
        <label for="orderIdInput">ORDER ID (optional)</label>
        <input id="orderIdInput" type="text" placeholder="Leave blank for auto-generated" />
        <div class="order-id-error" id="orderIdError">Order ID must be numeric.</div>
      </div>

      <h3>TOTAL: £<span id="total">0.00</span></h3>
      <button id="discountBtn">🏷 APPLY DISCOUNT</button>
      <button id="checkoutBtn">PLACE ORDER</button>
    </div>
  </aside>

  <!-- CUSTOMISE / DISCOUNT MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modalBox"></div>
  </div>

  <div class="overlay hidden" id="overlay"></div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    /* =========================
       MENU DATA
    ========================= */

    const MAINS = [
      {
        id: 1,
        name: "BigMak",
        desc: "Brioche bun with a juicy flame-grilled beef patty, crisp lettuce and vine-ripened tomatoes. Finished with your choice of sauce.",
        price: 4.00,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
      },
      {
        id: 2,
        name: "Loaded BigMak",
        desc: "Just like our BigMak but with fresh caramelised onions and our signature spicy mayo sauce.",
        price: 4.50,
        image: "https://images.unsplash.com/photo-1550547660-d9450f859349"
      },
      {
        id: 3,
        name: "Grilled Hotdog",
        desc: "A freshly-grilled sausage nestled in a soft brioche bun. Finished with a choice of classic sauces and caramelised onions.",
        price: 2.50,
        image: "https://images.unsplash.com/photo-1612392166886-ee8475b03af2"
      }
    ];

    const COMBOS = [
      {
        id: 4,
        name: "The Classic Mix",
        desc: "BigMak and a Grilled Hotdog — add your toppings to each!",
        price: 6.50,
        image: "https://images.unsplash.com/photo-1561758033-7e924f619b47",
        comboItems: ["BigMak", "Grilled Hotdog"]
      },
    ];

    /* =========================
       CUSTOMISE OPTIONS
    ========================= */

    const REMOVE_OPTS = [
      { label: "No Tomatoes",           extra: 0 },
      { label: "No Lettuce",            extra: 0 },
      { label: "No Caramelised Onions", extra: 0 },
      { label: "No Sauce",              extra: 0 }
    ];

    const ADD_OPTS = [
      { label: "Extra Lettuce",            extra: 0 },
      { label: "Extra Tomatoes",           extra: 0 },
      { label: "Extra Caramelised Onions", extra: 0.40 },
      { label: "Ketchup",                  extra: 0 },
      { label: "Mustard",                  extra: 0 },
      { label: "Spicy Mayo",               extra: 0.40 }
    ];

    /* =========================
       STATE
    ========================= */

    const cart = [];
    let discount = 0; // decimal, e.g. 0.1 = 10%

    /* =========================
       DOM REFS
    ========================= */

    const menuRoot    = document.getElementById("menuRoot");
    const cartItemsEl = document.getElementById("cartItems");
    const totalEl     = document.getElementById("total");
    const cartCountEl = document.getElementById("cartCount");

    /* =========================
       RENDER MENU
    ========================= */

    function makeSectionTitle(text) {
      const div = document.createElement("div");
      div.className = "menu-section-title";
      div.innerHTML = `<span>${text}</span>`;
      return div;
    }

    function renderMenu() {
      menuRoot.innerHTML = "";

      menuRoot.appendChild(makeSectionTitle("MAINS"));
      const mainsGrid = document.createElement("section");
      mainsGrid.className = "menu";
      MAINS.forEach(item => mainsGrid.appendChild(buildCard(item, false)));
      menuRoot.appendChild(mainsGrid);

      menuRoot.appendChild(makeSectionTitle("COMBOS"));
      const combosGrid = document.createElement("section");
      combosGrid.className = "menu";
      COMBOS.forEach(item => combosGrid.appendChild(buildCard(item, true)));
      menuRoot.appendChild(combosGrid);
    }

    function buildCard(item, isCombo) {
      const card = document.createElement("div");
      card.className = "card";
      card.style.cssText = "display:flex;flex-direction:column;";
      card.innerHTML = `
        <img src="${item.image}" alt="${item.name}" />
        <div class="card-content" style="display:flex;flex-direction:column;flex:1;">
          <h3>${item.name}</h3>
          <p class="card-desc" style="font-size:0.8rem;color:#aaa;margin:4px 0 8px;flex:1;">${item.desc}</p>
          <p class="price">£${item.price.toFixed(2)}</p>
          <button class="add-btn">ADD TO ORDER</button>
        </div>
      `;
      card.querySelector(".add-btn").addEventListener("click", () => openModal(item, isCombo));
      return card;
    }

    /* =========================
       ITEM CUSTOMISE MODAL
    ========================= */

    const modalOverlay = document.getElementById("modalOverlay");
    const modalBox     = document.getElementById("modalBox");

    function openModal(item, isCombo) {
      let inner = `
        <h2>${item.name}</h2>
        <p class="modal-subtitle">£${item.price.toFixed(2)} — customise your order below</p>
      `;

if (isCombo) {
  item.comboItems.forEach(subName => {
    const safeName = subName.replace(/[^a-zA-Z0-9]/g, "_");
    const subOpts = [];
    ADD_OPTS.forEach((opt, i) => {
      const cb = document.getElementById(`combo_${safeName}_add_${i}`);
      if (cb?.checked) {
        // ✅ REMOVED: extraCost += opt.extra;  — toppings are free for combos
        subOpts.push(opt.label);
      }
    });
    customisations.push({ itemName: subName, opts: subOpts });
  });
}
      } else {
        inner += `<div class="modal-section-title">REMOVE</div>`;
        REMOVE_OPTS.forEach((opt, i) => {
          inner += optionHTML(`remove_${i}`, opt);
        });
        inner += `<div class="modal-section-title">ADD / SAUCE</div>`;
        ADD_OPTS.forEach((opt, i) => {
          inner += optionHTML(`add_${i}`, opt);
        });
      }

      inner += `<div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">CANCEL</button>
        <button class="btn-confirm" id="modalConfirm">ADD TO ORDER</button>
      </div>`;

      modalBox.innerHTML = inner;

      window._pendingModalItem  = item;
      window._pendingModalCombo = isCombo;

      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalConfirm").addEventListener("click", () => {
        confirmAdd(window._pendingModalItem, window._pendingModalCombo);
      });

      document.getElementById("overlay").classList.add("hidden");
      document.getElementById("cart").classList.add("hidden");
      modalOverlay.classList.remove("hidden");
    }

    function optionHTML(id, opt) {
      return `
        <label class="modal-option" for="${id}">
          <input type="checkbox" id="${id}" />
          ${opt.label}
          ${opt.extra > 0 ? `<span class="extra-badge">+£${opt.extra.toFixed(2)}</span>` : ""}
        </label>
      `;
    }

    function closeModal() {
      modalOverlay.classList.add("hidden");
      modalBox.innerHTML = "";
    }

    function confirmAdd(item, isCombo) {
      if (!item) { console.error("confirmAdd: no item"); return; }
      let extraCost = 0;
      const customisations = [];

      if (isCombo) {
        item.comboItems.forEach(subName => {
          const safeName = subName.replace(/[^a-zA-Z0-9]/g, "_");
          const subOpts = [];
          ADD_OPTS.forEach((opt, i) => {
            const cb = document.getElementById(`combo_${safeName}_add_${i}`);
            if (cb?.checked) {
              extraCost += opt.extra;
              subOpts.push(opt.label);
            }
          });
          customisations.push({ itemName: subName, opts: subOpts });
        });
      } else {
        const opts = [];
        REMOVE_OPTS.forEach((opt, i) => {
          const cb = document.getElementById(`remove_${i}`);
          if (cb?.checked) opts.push(opt.label);
        });
        ADD_OPTS.forEach((opt, i) => {
          const cb = document.getElementById(`add_${i}`);
          if (cb?.checked) {
            extraCost += opt.extra;
            opts.push(opt.label);
          }
        });
        customisations.push({ itemName: item.name, opts });
      }

      cart.push({
        id:             item.id,
        name:           item.name,
        price:          item.price + extraCost,
        basePrice:      item.price,
        customisations: customisations
      });

      updateCart();
      closeModal();
    }

    /* =========================
       DISCOUNT MODAL
    ========================= */

    function openDiscountModal() {
      // Track which preset is currently hovered/selected for live preview
      let pendingDiscount = discount;

      function buildDiscountModal() {
        const pct = Math.round(pendingDiscount * 100);
        modalBox.innerHTML = `
          <h2>APPLY DISCOUNT</h2>
          <p class="modal-subtitle">Choose a preset or enter a custom percentage below</p>

          <div class="modal-section-title">PRESETS</div>
          <div class="discount-presets">
            <button class="preset-btn${pct === 10 ? " selected" : ""}" data-val="10">10%</button>
            <button class="preset-btn${pct === 20 ? " selected" : ""}" data-val="20">20%</button>
            <button class="preset-btn${pct === 25 ? " selected" : ""}" data-val="25">25%</button>
            <button class="preset-btn${pct === 50 ? " selected" : ""}" data-val="50">50%</button>
          </div>

          <div class="modal-section-title">CUSTOM DISCOUNT</div>
          <div class="discount-input-row">
            <input
              id="customDiscountInput"
              type="number"
              min="1"
              max="99"
              placeholder="Enter %"
              value="${pct > 0 && ![10,20,25,50].includes(pct) ? pct : ""}"
            />
            <span>%</span>
          </div>

          ${pendingDiscount > 0 ? `
            <div style="margin-top:16px;padding:12px 14px;background:#111;border-radius:10px;
              border:1px solid #2a2a2a;font-size:1rem;color:#aaa;text-align:center;">
              Preview: <strong style="color:#ffb703;">${Math.round(pendingDiscount * 100)}% off</strong>
              — saving
              <strong style="color:#ffb703;">
                £${(cart.reduce((s, i) => s + i.price, 0) * pendingDiscount).toFixed(2)}
              </strong>
            </div>
          ` : ""}

          <div class="modal-footer">
            <button class="btn-cancel" id="modalCancel">CANCEL</button>
            ${discount > 0 ? `<button class="btn-cancel" id="removeDiscountBtn"
              style="background:#c0392b;color:#fff;">REMOVE</button>` : ""}
            <button class="btn-confirm" id="modalConfirm">APPLY</button>
          </div>
        `;

        // Preset buttons
        modalBox.querySelectorAll(".preset-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const val = Number(btn.dataset.val) / 100;
            // Toggle off if already selected
            pendingDiscount = pendingDiscount === val ? 0 : val;
            document.getElementById("customDiscountInput").value = "";
            buildDiscountModal(); // re-render preview
          });
        });

        // Custom input live preview
        document.getElementById("customDiscountInput").addEventListener("input", (e) => {
          const val = parseFloat(e.target.value);
          if (!isNaN(val) && val > 0 && val < 100) {
            pendingDiscount = val / 100;
            // Deselect presets visually
            modalBox.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("selected"));
          } else {
            pendingDiscount = 0;
          }
        });

        // Cancel
        document.getElementById("modalCancel").addEventListener("click", closeModal);

        // Remove existing discount
        document.getElementById("removeDiscountBtn")?.addEventListener("click", () => {
          discount = 0;
          updateCart();
          closeModal();
        });

        // Apply
        document.getElementById("modalConfirm").addEventListener("click", () => {
          // If custom input has a value, use that
          const customVal = parseFloat(document.getElementById("customDiscountInput").value);
          if (!isNaN(customVal) && customVal > 0 && customVal < 100) {
            discount = customVal / 100;
          } else if (pendingDiscount > 0) {
            discount = pendingDiscount;
          } else {
            discount = 0;
          }
          updateCart();
          closeModal();
        });
      }

      buildDiscountModal();

      document.getElementById("overlay").classList.add("hidden");
      document.getElementById("cart").classList.add("hidden");
      modalOverlay.classList.remove("hidden");
    }

    /* =========================
       CART
    ========================= */

    function updateCart() {
      cartItemsEl.innerHTML = "";
      let subtotal = 0;

      cart.forEach((item, i) => {
        subtotal += item.price;

        const row = document.createElement("div");
        row.className = "cart-item";

        let customText = "";
        if (item.customisations?.length) {
          customText = item.customisations.map(c =>
            c.opts.length
              ? `<div style="font-size:0.75rem;color:#aaa;margin-top:2px;">${c.itemName}: ${c.opts.join(", ")}</div>`
              : ""
          ).join("");
        }

        row.innerHTML = `
          <div style="flex:1;">
            <span>${item.name}</span>
            ${customText}
          </div>
          <span>£${item.price.toFixed(2)}</span>
          <button class="remove-btn" data-index="${i}">✕</button>
        `;
        cartItemsEl.appendChild(row);
      });

      cartItemsEl.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          cart.splice(Number(btn.dataset.index), 1);
          updateCart();
        });
      });

      // Discount bar
      const discountBar   = document.getElementById("discountBar");
      const subtotalRow   = document.getElementById("subtotalRow");

      if (discount > 0 && subtotal > 0) {
        const saving = subtotal * discount;
        const pct    = Math.round(discount * 100);

        discountBar.innerHTML = `
          <div class="discount-bar">
            <span class="discount-bar-label">🏷 ${pct}% OFF — SAVING £${saving.toFixed(2)}</span>
            <button class="discount-bar-remove" id="removeDiscount" title="Remove discount">✕</button>
          </div>
        `;
        document.getElementById("removeDiscount").addEventListener("click", () => {
          discount = 0;
          updateCart();
        });

        subtotalRow.textContent = `SUBTOTAL: £${subtotal.toFixed(2)}`;
        subtotalRow.classList.remove("hidden");
      } else {
        discountBar.innerHTML = "";
        subtotalRow.classList.add("hidden");
      }

      const total = subtotal * (1 - discount);
      totalEl.innerText     = total.toFixed(2);
      cartCountEl.innerText = cart.length;
    }

    /* =========================
       CHECKOUT
    ========================= */

    document.getElementById("checkoutBtn").addEventListener("click", async () => {

      if (!cart.length) { alert("Your cart is empty!"); return; }

      // Read custom order ID (if provided)
      const orderIdInput = document.getElementById("orderIdInput");
      const orderIdError = document.getElementById("orderIdError");
      const rawOrderId   = orderIdInput.value.trim();

      let orderNumber;

      if (rawOrderId === "") {
        // No custom ID provided — auto-generate as before
        orderNumber = Math.floor(1000 + Math.random() * 9000);
        orderIdError.style.display = "none";
      } else if (/^\d+$/.test(rawOrderId)) {
        // Valid numeric custom ID
        orderNumber = Number(rawOrderId);
        orderIdError.style.display = "none";
      } else {
        // Invalid custom ID — block checkout
        orderIdError.style.display = "block";
        orderIdInput.focus();
        return;
      }

      const btn = document.getElementById("checkoutBtn");
      btn.disabled    = true;
      btn.textContent = "PLACING ORDER...";

      try {
        const subtotal     = cart.reduce((sum, item) => sum + item.price, 0);
        const discountAmt  = subtotal * discount;
        const total        = subtotal - discountAmt;

        const orderData = {
          orderNumber:   orderNumber,
          items:         cart.map(item => ({
            id:             item.id,
            name:           item.name,
            price:          item.price,
            customisations: item.customisations || []
          })),
          subtotal:      subtotal,
          discountPct:   Math.round(discount * 100),
          discountAmt:   discountAmt,
          total:         total,
          status:        "Preparing",
          completed:     false,
          created:       new Date()
        };

        await addDoc(collection(db, "orders"), orderData);

        alert(`Order #${orderData.orderNumber} placed successfully!`);
        cart.length = 0;
        discount    = 0;
        orderIdInput.value = "";
        updateCart();
        document.getElementById("cart").classList.add("hidden");
        document.getElementById("overlay").classList.add("hidden");

      } catch (err) {
        console.error("Firebase error:", err);
        alert(`Order failed: ${err.message}`);
      } finally {
        btn.disabled    = false;
        btn.textContent = "PLACE ORDER";
      }

    });

    /* =========================
       UI
    ========================= */

    function setupUI() {
      const openCartBtn  = document.getElementById("openCart");
      const closeCartBtn = document.getElementById("closeCart");
      const cartPanel    = document.getElementById("cart");
      const overlay      = document.getElementById("overlay");

      openCartBtn?.addEventListener("click", () => {
        cartPanel.classList.remove("hidden");
        overlay.classList.remove("hidden");
      });

      function closeAll() {
        cartPanel.classList.add("hidden");
        overlay.classList.add("hidden");
      }

      closeCartBtn?.addEventListener("click", closeAll);
      overlay?.addEventListener("click", closeAll);

      document.getElementById("discountBtn").addEventListener("click", openDiscountModal);
    }

    window.scrollToMenu = function () {
      document.getElementById("menuRoot")?.scrollIntoView({ behavior: "smooth" });
    };

    renderMenu();
    setupUI();

  </script>

</body>
