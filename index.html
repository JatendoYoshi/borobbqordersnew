<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boro BBQ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <style>
    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 28px;
      width: 92%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
      color: #fff;
    }

    .modal h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin: 0 0 4px;
    }

    .modal-subtitle {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 18px;
    }

    .modal-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f5c400;
      margin: 18px 0 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
    }

    .modal-item-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      color: #ccc;
      margin: 14px 0 8px;
      letter-spacing: 1px;
    }

    .modal-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #222;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .modal-option:hover { background: #2a2a2a; }
    .modal-option input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #f5c400;
      cursor: pointer;
    }
    .modal-option .extra-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #f5c400;
      color: #111;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .modal-footer button {
      flex: 1;
      padding: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-cancel { background: #333; color: #aaa; }
    .btn-confirm { background: #f5c400; color: #111; }

    /* ── MENU SECTIONS ── */
    .menu-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 4px;
      padding: 24px 20px 8px;
      color: #fff;
    }

    .menu-section-title span {
      display: inline-block;
      border-bottom: 3px solid #f5c400;
      padding-bottom: 4px;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <h1>BORO BBQ</h1>
    <div class="top-buttons">
      <a href="admin.html">
        <button id="adminBtn"><span>👨‍🍳</span> ADMIN DASHBOARD</button>
      </a>
      <div class="cart-button" id="openCart">
        🛒 <span id="cartCount">0</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>ORDER FAST.</h2>
      <h2>EAT BIG.</h2>
      <button onclick="scrollToMenu()">START ORDER</button>
    </div>
  </section>

  <!-- MENU -->
  <div id="menuRoot"></div>

  <!-- CART -->
  <aside class="cart hidden" id="cart">
    <div class="cart-header">
      <h2>YOUR ORDER</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <h3>TOTAL: £<span id="total">0.00</span></h3>
      <button id="checkoutBtn">PLACE ORDER</button>
    </div>
  </aside>

  <!-- CUSTOMISE MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modalBox"></div>
  </div>

  <div class="overlay hidden" id="overlay"></div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    /* =========================
       MENU DATA
    ========================= */

    const MAINS = [
      {
        id: 1,
        name: "BigMak",
        desc: "Brioche bun with a juicy flame-grilled beef patty, crisp lettuce and vine-ripened tomatoes. Finished with your choice of sauce.",
        price: 4.00,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
      },
      {
        id: 2,
        name: "Loaded BigMak",
        desc: "Just like our BigMak but with fresh caramelised onions and our signature spicy mayo sauce.",
        price: 4.50,
        image: "https://images.unsplash.com/photo-1550547660-d9450f859349"
      },
      {
        id: 3,
        name: "Grilled Hotdog",
        desc: "A freshly-grilled sausage nestled in a soft brioche bun. Finished with a choice of classic sauces and caramelised onions.",
        price: 2.50,
        image: "https://images.unsplash.com/photo-1612392166886-ee8475b03af2"
      }
    ];

    const COMBOS = [
      {
        id: 4,
        name: "The Classic Mix",
        desc: "BigMak and a Grilled Hotdog — add your toppings to each!",
        price: 5.50,
        image: "https://images.unsplash.com/photo-1561758033-7e924f619b47",
        comboItems: ["BigMak", "Grilled Hotdog"]
      },
      {
        id: 5,
        name: "The Ultimate Mix",
        desc: "Loaded BigMak and a Grilled Hotdog — add your toppings to each!",
        price: 5.50,
        image: "https://images.unsplash.com/photo-1606755962773-d324e0a13086",
        comboItems: ["Loaded BigMak", "Grilled Hotdog"]
      }
    ];

    /* =========================
       CUSTOMISE OPTIONS
    ========================= */

    const REMOVE_OPTS = [
      { label: "No Tomatoes",          extra: 0 },
      { label: "No Lettuce",           extra: 0 },
      { label: "No Caramelised Onions",extra: 0 },
      { label: "No Sauce",             extra: 0 }
    ];

    const ADD_OPTS = [
      { label: "Extra Lettuce",            extra: 0 },
      { label: "Extra Tomatoes",           extra: 0 },
      { label: "Extra Caramelised Onions", extra: 0.40 },
      { label: "Ketchup",                  extra: 0 },
      { label: "Mustard",                  extra: 0 },
      { label: "Spicy Mayo",               extra: 0.40 }
    ];

    /* =========================
       STATE
    ========================= */

    const cart = [];

    /* =========================
       DOM REFS
    ========================= */

    const menuRoot    = document.getElementById("menuRoot");
    const cartItemsEl = document.getElementById("cartItems");
    const totalEl     = document.getElementById("total");
    const cartCountEl = document.getElementById("cartCount");

    /* =========================
       RENDER MENU
    ========================= */

    function renderMenu() {
      menuRoot.innerHTML = "";

      // MAINS
      menuRoot.innerHTML += `<div class="menu-section-title"><span>MAINS</span></div>`;
      const mainsGrid = document.createElement("section");
      mainsGrid.className = "menu";
      MAINS.forEach(item => mainsGrid.appendChild(buildCard(item, false)));
      menuRoot.appendChild(mainsGrid);

      // COMBOS
      menuRoot.innerHTML += `<div class="menu-section-title"><span>COMBOS</span></div>`;
      const combosGrid = document.createElement("section");
      combosGrid.className = "menu";
      COMBOS.forEach(item => combosGrid.appendChild(buildCard(item, true)));
      menuRoot.appendChild(combosGrid);
    }

    function buildCard(item, isCombo) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${item.image}" alt="${item.name}" />
        <div class="card-content">
          <h3>${item.name}</h3>
          <p class="card-desc" style="font-size:0.8rem;color:#aaa;margin:4px 0 8px;">${item.desc}</p>
          <p>£${item.price.toFixed(2)}</p>
          <button class="add-btn">ADD TO ORDER</button>
        </div>
      `;
      card.querySelector(".add-btn").addEventListener("click", () => openModal(item, isCombo));
      return card;
    }

    /* =========================
       MODAL
    ========================= */

    const modalOverlay = document.getElementById("modalOverlay");
    const modalBox     = document.getElementById("modalBox");

    function openModal(item, isCombo) {
      modalBox.innerHTML = "";

      modalBox.innerHTML += `
        <h2>${item.name}</h2>
        <p class="modal-subtitle">£${item.price.toFixed(2)} — customise your order below</p>
      `;

      if (isCombo) {
        // Ask add-options for each item in the combo
        item.comboItems.forEach(subName => {
          modalBox.innerHTML += `<div class="modal-item-label">🍔 ${subName}</div>`;
          modalBox.innerHTML += `<div class="modal-section-title">ADD TOPPINGS</div>`;
          ADD_OPTS.forEach((opt, i) => {
            modalBox.innerHTML += optionHTML(`combo_${subName}_add_${i}`, opt);
          });
        });
      } else {
        // REMOVE options
        modalBox.innerHTML += `<div class="modal-section-title">REMOVE</div>`;
        REMOVE_OPTS.forEach((opt, i) => {
          modalBox.innerHTML += optionHTML(`remove_${i}`, opt);
        });

        // ADD options
        modalBox.innerHTML += `<div class="modal-section-title">ADD / SAUCE</div>`;
        ADD_OPTS.forEach((opt, i) => {
          modalBox.innerHTML += optionHTML(`add_${i}`, opt);
        });
      }

      // Footer buttons — injected as HTML then listeners attached
      const footer = document.createElement("div");
      footer.className = "modal-footer";

      const cancelBtn = document.createElement("button");
      cancelBtn.className   = "btn-cancel";
      cancelBtn.textContent = "CANCEL";
      cancelBtn.addEventListener("click", closeModal);

      const confirmBtn = document.createElement("button");
      confirmBtn.className   = "btn-confirm";
      confirmBtn.textContent = "ADD TO ORDER";
      confirmBtn.addEventListener("click", () => confirmAdd(item, isCombo));

      footer.appendChild(cancelBtn);
      footer.appendChild(confirmBtn);
      modalBox.appendChild(footer);

      modalOverlay.classList.remove("hidden");
    }

    function optionHTML(id, opt) {
      return `
        <label class="modal-option" for="${id}">
          <input type="checkbox" id="${id}" />
          ${opt.label}
          ${opt.extra > 0 ? `<span class="extra-badge">+£${opt.extra.toFixed(2)}</span>` : ""}
        </label>
      `;
    }

    function closeModal() {
      modalOverlay.classList.add("hidden");
      modalBox.innerHTML = "";
    }

    function confirmAdd(item, isCombo) {
      let extraCost = 0;
      const customisations = [];

      if (isCombo) {
        item.comboItems.forEach(subName => {
          const subOpts = [];
          ADD_OPTS.forEach((opt, i) => {
            const cb = document.getElementById(`combo_${subName}_add_${i}`);
            if (cb?.checked) {
              extraCost += opt.extra;
              subOpts.push(opt.label);
            }
          });
          if (subOpts.length) {
            customisations.push(`${subName}: ${subOpts.join(", ")}`);
          } else {
            customisations.push(`${subName}: No extras`);
          }
        });
      } else {
        REMOVE_OPTS.forEach((opt, i) => {
          const cb = document.getElementById(`remove_${i}`);
          if (cb?.checked) customisations.push(opt.label);
        });
        ADD_OPTS.forEach((opt, i) => {
          const cb = document.getElementById(`add_${i}`);
          if (cb?.checked) {
            extraCost += opt.extra;
            customisations.push(opt.label);
          }
        });
      }

      const cartItem = {
        id:             item.id,
        name:           item.name,
        price:          item.price + extraCost,
        basePrice:      item.price,
        customisations: customisations
      };

      cart.push(cartItem);
      updateCart();
      closeModal();
    }

    /* =========================
       CART
    ========================= */

    function updateCart() {
      cartItemsEl.innerHTML = "";
      let total = 0;

      cart.forEach((item, i) => {
        total += item.price;

        const row = document.createElement("div");
        row.className = "cart-item";

        const customText = item.customisations?.length
          ? `<div style="font-size:0.75rem;color:#aaa;margin-top:3px;">${item.customisations.join(" · ")}</div>`
          : "";

        row.innerHTML = `
          <div style="flex:1;">
            <span>${item.name}</span>
            ${customText}
          </div>
          <span>£${item.price.toFixed(2)}</span>
          <button class="remove-btn" data-index="${i}">✕</button>
        `;
        cartItemsEl.appendChild(row);
      });

      cartItemsEl.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          cart.splice(Number(btn.dataset.index), 1);
          updateCart();
        });
      });

      totalEl.innerText     = total.toFixed(2);
      cartCountEl.innerText = cart.length;
    }

    /* =========================
       CHECKOUT
    ========================= */

    document.getElementById("checkoutBtn").addEventListener("click", async () => {

      if (!cart.length) { alert("Your cart is empty!"); return; }

      const btn = document.getElementById("checkoutBtn");
      btn.disabled    = true;
      btn.textContent = "PLACING ORDER...";

      try {

        const orderData = {
          orderNumber:    Math.floor(1000 + Math.random() * 9000),
          items:          cart.map(item => ({
            id:             item.id,
            name:           item.name,
            price:          item.price,
            customisations: item.customisations || []
          })),
          total:     cart.reduce((sum, item) => sum + item.price, 0),
          status:    "Preparing",
          completed: false,
          created:   new Date()
        };

        await addDoc(collection(db, "orders"), orderData);

        alert(`Order #${orderData.orderNumber} placed successfully!`);
        cart.length = 0;
        updateCart();
        document.getElementById("cart").classList.add("hidden");
        document.getElementById("overlay").classList.add("hidden");

      } catch (err) {
        console.error("Firebase error:", err);
        alert(`Order failed: ${err.message}`);
      } finally {
        btn.disabled    = false;
        btn.textContent = "PLACE ORDER";
      }

    });

    /* =========================
       UI
    ========================= */

    function setupUI() {

      const openCartBtn  = document.getElementById("openCart");
      const closeCartBtn = document.getElementById("closeCart");
      const cartPanel    = document.getElementById("cart");
      const overlay      = document.getElementById("overlay");

      openCartBtn?.addEventListener("click", () => {
        cartPanel.classList.remove("hidden");
        overlay.classList.remove("hidden");
      });

      function closeAll() {
        cartPanel.classList.add("hidden");
        overlay.classList.add("hidden");
      }

      closeCartBtn?.addEventListener("click", closeAll);
      overlay?.addEventListener("click", closeAll);

    }

    window.scrollToMenu = function () {
      document.getElementById("menuRoot")?.scrollIntoView({ behavior: "smooth" });
    };

    renderMenu();
    setupUI();

  </script>

</body>
</html>
