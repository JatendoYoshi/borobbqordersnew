<!DOCTYPE html>
<html lang="en">
 
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boro Burgers Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
 
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-badge.preparing {
      background: #f5c400;
      color: #111;
    }
    .status-badge.ready {
      background: #00c853;
      color: #fff;
    }
    .status-badge.completed {
      background: #555;
      color: #fff;
    }
    .empty-msg {
      color: #888;
      font-style: italic;
      padding: 12px 0;
    }
  </style>
 
</head>
 
<body>
 
  <header class="admin-topbar">
    <div>
      <h1>🍔 BORO BURGERS</h1>
      <p>LIVE ORDER DASHBOARD</p>
    </div>
    <a href="index.html">
      <button class="back-btn">← RETURN TO KIOSK</button>
    </a>
  </header>
 
  <section class="stats">
    <div class="stat-card">
      <h2 id="orderCount">0</h2>
      <p>TOTAL ORDERS</p>
    </div>
    <div class="stat-card">
      <h2 id="revenue">£0</h2>
      <p>REVENUE</p>
    </div>
  </section>
 
  <section class="orders-grid">
    <h1 class="section-title">ACTIVE ORDERS</h1>
    <div id="activeOrders"></div>
 
    <h1 class="section-title">COMPLETED ORDERS</h1>
    <div id="completedOrders"></div>
  </section>
 
  <script type="module">
 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd",
      measurementId: "G-GHRWMRM0PZ"
    };
 
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
 
    const orderCountEl = document.getElementById("orderCount");
    const revenueEl    = document.getElementById("revenue");
 
    /* =========================
       STATUS BADGE HELPER
    ========================= */
 
    function statusBadge(status) {
      const cls = status === "Preparing" ? "preparing"
                : status === "Ready"     ? "ready"
                : "completed";
      return `<span class="status-badge ${cls}">${status}</span>`;
    }
 
    /* =========================
       LIVE LISTENER
    ========================= */
 
    async function setStatus(id, status, completed) {
      await updateDoc(doc(db, "orders", id), { status, completed });
    }
 
    function createCard(docId, order) {
      const isCompleted = order.completed === true;
 
      const card = document.createElement("div");
      card.className = "admin-order-card";
 
      const createdAt = order.created?.toDate
        ? order.created.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        : "";
 
      const itemsHTML = (order.items || []).map(item => `
        <div class="admin-item">
          <p>${item.name}</p>
          <strong>£${(item.price ?? 0).toFixed(2)}</strong>
        </div>
      `).join("");
 
      const statusCls = order.status === "Preparing" ? "preparing"
                      : order.status === "Ready"     ? "ready"
                      : "completed";
 
      card.innerHTML = `
        <div class="order-top">
          <h2>ORDER #${order.orderNumber ?? "—"}</h2>
          <div style="display:flex;align-items:center;gap:10px;">
            ${createdAt ? `<span style="font-size:0.8rem;color:#aaa;">${createdAt}</span>` : ""}
            <span class="status-badge ${statusCls}">${order.status ?? "Preparing"}</span>
          </div>
        </div>
        <div class="items">${itemsHTML}</div>
        <div class="order-total">TOTAL: £${(order.total ?? 0).toFixed(2)}</div>
      `;
 
      if (!isCompleted) {
        const btns = document.createElement("div");
        btns.className = "admin-buttons";
 
        const preparing = document.createElement("button");
        preparing.textContent = "PREPARING";
        preparing.addEventListener("click", () => setStatus(docId, "Preparing", false));
 
        const ready = document.createElement("button");
        ready.textContent = "READY";
        ready.addEventListener("click", () => setStatus(docId, "Ready", false));
 
        const complete = document.createElement("button");
        complete.textContent = "COMPLETE ✓";
        complete.addEventListener("click", () => setStatus(docId, "Completed", true));
 
        btns.appendChild(preparing);
        btns.appendChild(ready);
        btns.appendChild(complete);
        card.appendChild(btns);
      }
 
      return card;
    }
 
    onSnapshot(collection(db, "orders"), (snapshot) => {
 
      const activeEl    = document.getElementById("activeOrders");
      const completedEl = document.getElementById("completedOrders");
 
      activeEl.innerHTML    = "";
      completedEl.innerHTML = "";
 
      let totalRevenue = 0;
      orderCountEl.innerText = snapshot.size;
 
      snapshot.forEach((docSnap) => {
        const order = docSnap.data();
        totalRevenue += order.total ?? 0;
 
        if (order.completed === true) {
          completedEl.appendChild(createCard(docSnap.id, order));
        } else {
          activeEl.appendChild(createCard(docSnap.id, order));
        }
      });
 
      if (!activeEl.hasChildNodes()) {
        activeEl.innerHTML = `<p class="empty-msg">No active orders right now.</p>`;
      }
      if (!completedEl.hasChildNodes()) {
        completedEl.innerHTML = `<p class="empty-msg">No completed orders yet.</p>`;
      }
 
      revenueEl.innerText = `£${totalRevenue.toFixed(2)}`;
 
    });
 
  </script>
 
</body>
</html>
