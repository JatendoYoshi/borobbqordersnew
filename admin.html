<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boro Burgers Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>

    .kanban {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .kanban-col {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 16px;
      min-height: 300px;
    }

    .kanban-col-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #2a2a2a;
    }

    .kanban-col-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 0;
      color: #fff;
    }

    .col-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .col-dot.preparing { background: #f5c400; }
    .col-dot.ready     { background: #00c853; }
    .col-dot.completed { background: #888; }

    .col-count {
      margin-left: auto;
      background: #2a2a2a;
      color: #aaa;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .admin-order-card {
      background: #222;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 4px solid #333;
    }
    .admin-order-card.preparing { border-left-color: #f5c400; }
    .admin-order-card.ready     { border-left-color: #00c853; }
    .admin-order-card.completed { border-left-color: #555; opacity: 0.75; }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .order-top h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      margin: 0;
      letter-spacing: 1px;
      color: #fff;
    }

    .order-time {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      padding: 3px 0;
      border-bottom: 1px solid #2a2a2a;
      color: #ccc;
    }

    .order-total {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-top: 10px;
      color: #fff;
    }

    .admin-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .admin-buttons button {
      flex: 1;
      min-width: 70px;
      padding: 7px 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .admin-buttons button:hover { opacity: 0.8; }

    .btn-preparing { background: #f5c400; color: #111; }
    .btn-ready     { background: #00c853; color: #fff; }
    .btn-complete  { background: #333; color: #fff; border: 1px solid #555 !important; }
    .btn-undo      { background: #c0392b; color: #fff; width: 100%; flex: unset; }

    .admin-buttons button.active-status {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .empty-msg {
      color: #555;
      font-style: italic;
      font-size: 0.95rem;
      text-align: center;
      padding: 24px 0;
    }

    @media (max-width: 768px) {
      .kanban { grid-template-columns: 1fr; }
    }

  </style>
</head>

<body>

  <header class="admin-topbar">
    <div>
      <h1>🍔 BORO BURGERS</h1>
      <p>LIVE ORDER DASHBOARD</p>
    </div>
    <a href="index.html">
      <button class="back-btn">← RETURN TO KIOSK</button>
    </a>
      <a href="customerboard.html">
      <button class="back-btn">Customer Dashboard</button>
    </a>
    <button id="clearAllBtn" style="background:#c0392b;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">🗑 CLEAR ALL ORDERS</button>
  </header>

  <section class="stats">
    <div class="stat-card">
      <h2 id="orderCount">0</h2>
      <p>TOTAL ORDERS</p>
    </div>
    <div class="stat-card">
      <h2 id="revenue">£0</h2>
      <p>REVENUE</p>
    </div>
  </section>

  <div class="kanban">

    <div class="kanban-col">
      <div class="kanban-col-header">
        <div class="col-dot preparing"></div>
        <h2>PREPARING</h2>
        <span class="col-count" id="countPreparing">0</span>
      </div>
      <div id="colPreparing"></div>
    </div>

    <div class="kanban-col">
      <div class="kanban-col-header">
        <div class="col-dot ready"></div>
        <h2>READY</h2>
        <span class="col-count" id="countReady">0</span>
      </div>
      <div id="colReady"></div>
    </div>

    <div class="kanban-col">
      <div class="kanban-col-header">
        <div class="col-dot completed"></div>
        <h2>COMPLETED</h2>
        <span class="col-count" id="countCompleted">0</span>
      </div>
      <div id="colCompleted"></div>
    </div>

  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc,
      deleteDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd",
      measurementId: "G-GHRWMRM0PZ"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const orderCountEl = document.getElementById("orderCount");
    const revenueEl    = document.getElementById("revenue");

    async function setStatus(id, status, completed) {
      await updateDoc(doc(db, "orders", id), { status, completed });
    }

    function createCard(docId, order) {

      const status      = order.status ?? "Preparing";
      const isCompleted = order.completed === true;
      const statusCls   = isCompleted        ? "completed"
                        : status === "Ready" ? "ready"
                        : "preparing";

      const card = document.createElement("div");
      card.className = `admin-order-card ${statusCls}`;

      const createdAt = order.created?.toDate
        ? order.created.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        : "";

      const itemsHTML = (order.items || []).map(item => {
        // customisations is array of { itemName, opts[] }
        let customsHTML = "";
        if (item.customisations?.length) {
          item.customisations.forEach(c => {
            if (!c.opts || !c.opts.length) return;
            customsHTML += `
              <div style="font-size:1.05rem;color:#f5c400;margin:6px 0 2px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;">
                ${c.itemName}
              </div>
              <ul style="margin:0 0 6px 20px;padding:0;font-size:1.05rem;color:#bbb;line-height:1.9;">
                ${c.opts.map(o => `<li>${o}</li>`).join("")}
              </ul>
            `;
          });
        }
        return `
          <div class="admin-item" style="flex-direction:column;align-items:flex-start;">
            <div style="display:flex;justify-content:space-between;width:100%;margin-bottom:2px;">
              <span style="font-size:1.1rem;font-weight:bold;color:#fff;">${item.name}</span>
              <strong style="font-size:1.1rem;">£${(item.price ?? 0).toFixed(2)}</strong>
            </div>
            ${customsHTML}
          </div>
        `;
      }).join("");

      card.innerHTML = `
        <div class="order-top">
          <h2>ORDER #${order.orderNumber ?? "—"}</h2>
        </div>
        ${createdAt ? `<div class="order-time">Placed at ${createdAt}</div>` : ""}
        <div class="items">${itemsHTML}</div>
        <div class="order-total">TOTAL: £${(order.total ?? 0).toFixed(2)}</div>
      `;

      const btns = document.createElement("div");
      btns.className = "admin-buttons";

      if (isCompleted) {

        const undo = document.createElement("button");
        undo.className   = "btn-undo";
        undo.textContent = "↩ UNDO";
        undo.addEventListener("click", () => setStatus(docId, "Preparing", false));
        btns.appendChild(undo);

      } else {

        const preparingBtn = document.createElement("button");
        preparingBtn.className   = "btn-preparing" + (status === "Preparing" ? " active-status" : "");
        preparingBtn.textContent = "PREPARING";
        preparingBtn.addEventListener("click", () => setStatus(docId, "Preparing", false));

        const readyBtn = document.createElement("button");
        readyBtn.className   = "btn-ready" + (status === "Ready" ? " active-status" : "");
        readyBtn.textContent = "READY";
        readyBtn.addEventListener("click", () => setStatus(docId, "Ready", false));

        const completeBtn = document.createElement("button");
        completeBtn.className   = "btn-complete";
        completeBtn.textContent = "COMPLETE ✓";
        completeBtn.addEventListener("click", () => setStatus(docId, "Completed", true));

        btns.appendChild(preparingBtn);
        btns.appendChild(readyBtn);
        btns.appendChild(completeBtn);

      }

      card.appendChild(btns);
      return card;
    }

    onSnapshot(collection(db, "orders"), (snapshot) => {

      const colPreparing = document.getElementById("colPreparing");
      const colReady     = document.getElementById("colReady");
      const colCompleted = document.getElementById("colCompleted");

      colPreparing.innerHTML = "";
      colReady.innerHTML     = "";
      colCompleted.innerHTML = "";

      let totalRevenue = 0;
      let cntPreparing = 0;
      let cntReady     = 0;
      let cntCompleted = 0;

      // Sort oldest → newest so most recent orders appear at bottom
      const docs = [];
      snapshot.forEach(docSnap => docs.push(docSnap));
      docs.sort((a, b) => {
        const tA = a.data().created?.toMillis?.() ?? 0;
        const tB = b.data().created?.toMillis?.() ?? 0;
        return tB - tA;
      });

      docs.forEach((docSnap) => {
        const order = docSnap.data();
        totalRevenue += order.total ?? 0;

        if (order.completed === true) {
          colCompleted.appendChild(createCard(docSnap.id, order));
          cntCompleted++;
        } else if (order.status === "Ready") {
          colReady.appendChild(createCard(docSnap.id, order));
          cntReady++;
        } else {
          colPreparing.appendChild(createCard(docSnap.id, order));
          cntPreparing++;
        }
      });

      if (!cntPreparing) colPreparing.innerHTML = `<p class="empty-msg">No orders preparing.</p>`;
      if (!cntReady)     colReady.innerHTML     = `<p class="empty-msg">No orders ready.</p>`;
      if (!cntCompleted) colCompleted.innerHTML = `<p class="empty-msg">No completed orders.</p>`;
      // Auto-delete oldest completed orders once cap of 5 is exceeded
      const completedDocs = docs.filter(d => d.data().completed === true);
      completedDocs.sort((a, b) => {
        const tA = a.data().created?.toMillis?.() ?? 0;
        const tB = b.data().created?.toMillis?.() ?? 0;
        return tA - tB; // oldest first
      });
      if (completedDocs.length > 5) {
        const toDelete = completedDocs.slice(0, completedDocs.length - 5);
        toDelete.forEach(d => deleteDoc(doc(db, "orders", d.id)));
      }

      document.getElementById("countPreparing").textContent = cntPreparing;
      document.getElementById("countReady").textContent     = cntReady;
      document.getElementById("countCompleted").textContent = cntCompleted;

      orderCountEl.innerText = snapshot.size;
      revenueEl.innerText    = `£${totalRevenue.toFixed(2)}`;

    });

    /* =========================
       CLEAR ALL ORDERS
    ========================= */

    document.getElementById("clearAllBtn").addEventListener("click", async () => {
      const confirmed = confirm("Are you sure you want to delete ALL orders? This cannot be undone.");
      if (!confirmed) return;

      const snapshot = await getDocs(collection(db, "orders"));
      const deletions = snapshot.docs.map(d => deleteDoc(doc(db, "orders", d.id)));
      await Promise.all(deletions);

      alert("All orders cleared.");
    });

  </script>

</body>
</html>
