<!DOCTYPE html>
<html lang="en">
 
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boro Burgers Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
 
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-badge.preparing {
      background: #f5c400;
      color: #111;
    }
    .status-badge.ready {
      background: #00c853;
      color: #fff;
    }
    .status-badge.completed {
      background: #555;
      color: #fff;
    }
    .empty-msg {
      color: #888;
      font-style: italic;
      padding: 12px 0;
    }
  </style>
 
</head>
 
<body>
 
  <header class="admin-topbar">
    <div>
      <h1>🍔 BORO BURGERS</h1>
      <p>LIVE ORDER DASHBOARD</p>
    </div>
    <a href="index.html">
      <button class="back-btn">← RETURN TO KIOSK</button>
    </a>
  </header>
 
  <section class="stats">
    <div class="stat-card">
      <h2 id="orderCount">0</h2>
      <p>TOTAL ORDERS</p>
    </div>
    <div class="stat-card">
      <h2 id="revenue">£0</h2>
      <p>REVENUE</p>
    </div>
  </section>
 
  <section class="orders-grid">
    <h1 class="section-title">ACTIVE ORDERS</h1>
    <div id="activeOrders"></div>
 
    <h1 class="section-title">COMPLETED ORDERS</h1>
    <div id="completedOrders"></div>
  </section>
 
  <script type="module">
 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
    const firebaseConfig = {
      apiKey: "AIzaSyAJnS04WcEaSizVnd92hprBiml1XP7vzoE",
      authDomain: "borobbqorders.firebaseapp.com",
      projectId: "borobbqorders",
      storageBucket: "borobbqorders.firebasestorage.app",
      messagingSenderId: "608958491192",
      appId: "1:608958491192:web:a35df22ce7067f582d54cd",
      measurementId: "G-GHRWMRM0PZ"
    };
 
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
 
    const orderCountEl = document.getElementById("orderCount");
    const revenueEl    = document.getElementById("revenue");
 
    /* =========================
       STATUS BADGE HELPER
    ========================= */
 
    function statusBadge(status) {
      const cls = status === "Preparing" ? "preparing"
                : status === "Ready"     ? "ready"
                : "completed";
      return `<span class="status-badge ${cls}">${status}</span>`;
    }
 
    /* =========================
       BUILD ORDER CARD
    ========================= */
 
    function buildCard(docId, order) {
 
      const isCompleted = order.completed === true;
 
      const itemsHTML = (order.items || []).map(item => `
        <div class="admin-item">
          <p>${item.name}</p>
          <strong>£${(item.price ?? 0).toFixed(2)}</strong>
        </div>
      `).join("");
 
      const createdAt = order.created?.toDate
        ? order.created.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        : "";
 
      const adminButtons = isCompleted ? "" : `
        <div class="admin-buttons">
          <button data-id="${docId}" data-action="preparing">PREPARING</button>
          <button data-id="${docId}" data-action="ready">READY</button>
          <button data-id="${docId}" data-action="complete">COMPLETE ✓</button>
        </div>
      `;
 
      return `
        <div class="admin-order-card" data-doc="${docId}">
          <div class="order-top">
            <h2>ORDER #${order.orderNumber ?? "—"}</h2>
            <div style="display:flex;align-items:center;gap:10px;">
              ${createdAt ? `<span style="font-size:0.8rem;color:#aaa;">${createdAt}</span>` : ""}
              ${statusBadge(order.status ?? "Preparing")}
            </div>
          </div>
          <div class="items">${itemsHTML}</div>
          <div class="order-total">TOTAL: £${(order.total ?? 0).toFixed(2)}</div>
          ${adminButtons}
        </div>
      `;
    }
 
    /* =========================
       LIVE LISTENER
    ========================= */
 
    onSnapshot(collection(db, "orders"), (snapshot) => {
 
      const activeEl    = document.getElementById("activeOrders");
      const completedEl = document.getElementById("completedOrders");
 
      activeEl.innerHTML    = "";
      completedEl.innerHTML = "";
 
      let totalRevenue = 0;
      orderCountEl.innerText = snapshot.size;
 
      snapshot.forEach((docSnap) => {
        const order = docSnap.data();
        totalRevenue += order.total ?? 0;
 
        if (order.completed === true) {
          completedEl.innerHTML += buildCard(docSnap.id, order);
        } else {
          activeEl.innerHTML += buildCard(docSnap.id, order);
        }
      });
 
      if (!activeEl.innerHTML) {
        activeEl.innerHTML = `<p class="empty-msg">No active orders right now.</p>`;
      }
      if (!completedEl.innerHTML) {
        completedEl.innerHTML = `<p class="empty-msg">No completed orders yet.</p>`;
      }
 
      revenueEl.innerText = `£${totalRevenue.toFixed(2)}`;
 
      // Attach button listeners after render
      document.querySelectorAll(".admin-buttons button").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id     = btn.dataset.id;
          const action = btn.dataset.action;
 
          if (action === "preparing") {
            await updateDoc(doc(db, "orders", id), { status: "Preparing", completed: false });
          } else if (action === "ready") {
            await updateDoc(doc(db, "orders", id), { status: "Ready", completed: false });
          } else if (action === "complete") {
            await updateDoc(doc(db, "orders", id), { status: "Completed", completed: true });
          }
        });
      });
 
    });
 
  </script>
 
</body>
</html>
